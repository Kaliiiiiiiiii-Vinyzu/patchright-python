[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[project]
name = "patchright"
dynamic = ["version"]
description = "Undetected Python version of the Playwright testing and automation library."
requires-python = ">=3.11"

[tool.setuptools]
packages = []

[tool.setuptools_scm]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-Wall -rsx" #  -s
markers = [
    "skip_browser",
    "only_browser",
    "skip_platform",
    "only_platform"
]
junit_family = "xunit2"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "autobahn>=25.12.2",
    "pillow>=12.0.0",
    "pixelmatch>=0.3.0",
    "pyopenssl>=25.3.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "requests>=2.32.5",
    "twisted>=25.5.0",
    "toml>=0.10.0"
]
