name: Patchright Release Workflow

# Job flow: check-release-version -> run-patchright-tests
#   -> patchright-release-workflow: build the wheels (read-only token)
#   -> publish-pypi: verify the checksums and publish (the only job with id-token: write).
# Build and publish are separate jobs so the PyPI publish token is never present while
# dependency installs and the playwright-python build run; only the wheels and their checksums are passed on.

on:
  # enabling manual trigger
  workflow_dispatch:
    inputs:
      patchright_version:
        description: 'Patchright Release Version (e.g. v1.58.0 or 1.58.0) on PyPI'
        required: true
        type: string
  # running every hour
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: patchright-pypi-release
  cancel-in-progress: false

# Read-only by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  check-release-version:
    name: Check Release Version
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.version_check.outputs.proceed }}
      playwright_version: ${{ steps.version_check.outputs.playwright_version }}
      patchright_core_version: ${{ steps.version_check.outputs.patchright_core_version }}
      patchright_version: ${{ steps.version_check.outputs.patchright_version }}
    steps:
      # Actions are pinned to a full commit SHA, which can't be moved like a tag; the comment
      # names the release it points to, and Dependabot (.github/dependabot.yml) keeps both up to date.
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # don't leave the token in .git/config for later steps

      - name: Check Release Version
        id: version_check
        env:
          MANUAL_PATCHRIGHT_VERSION: ${{ inputs.patchright_version || '' }}
        run: |
          utils/release_version_check.sh

  run-patchright-tests:
    name: Run Patchright Tests
    needs: check-release-version
    if: needs.check-release-version.outputs.proceed == 'true'
    uses: ./.github/workflows/patchright_tests.yml
    with:
      playwright_version: ${{ needs.check-release-version.outputs.playwright_version }}
      patchright_core_version: ${{ needs.check-release-version.outputs.patchright_core_version }}
      patchright_version: ${{ needs.check-release-version.outputs.patchright_version }}

  patchright-release-workflow:
    name: "Patchright-Python Workflow: Install, Patch and Build Patchright Python Package"
    needs: [check-release-version, run-patchright-tests]
    runs-on: ubuntu-latest
    env:
      playwright_version: ${{ needs.check-release-version.outputs.playwright_version }}
      patchright_core_version: ${{ needs.check-release-version.outputs.patchright_core_version }}
      patchright_version: ${{ needs.check-release-version.outputs.patchright_version }}
    # Read-only: this job installs dependencies and runs the build, so it gets no publish rights.
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false # build release packages from a clean install, not a shared cache

      - name: Set up Python
        run: uv python install

      - name: Install Playwright-Python Package
        run: |
          uv sync --all-groups
          if curl -fsSL "https://pypi.org/pypi/patchright/$patchright_version/json" >/dev/null 2>&1; then
            echo "::error::Patchright $patchright_version already exists on PyPI"
            exit 1
          fi
          if ! published_version=$(npm view "patchright-core@$patchright_core_version" version); then
            echo "::error::patchright-core@$patchright_core_version is not available from npm"
            exit 1
          fi
          if [ "$published_version" != "$patchright_core_version" ]; then
            echo "::error::Expected patchright-core@$patchright_core_version, npm returned $published_version"
            exit 1
          fi
          git clone https://github.com/microsoft/playwright-python --branch "$playwright_version"
          # Log the exact upstream commit the tag pointed to, so the build can be traced later.
          echo "microsoft/playwright-python $playwright_version is commit $(git -C playwright-python rev-parse HEAD)"
          uv add -r playwright-python/local-requirements.txt --dev

      - name: Patch Playwright-Python Package
        run: |
          uv run patch_python_package.py
          # Pinned so the formatting step is reproducible; Dependabot does not update it, so bump by hand.
          uvx ruff@0.17.6 format playwright-python

      # Build the wheels and record their SHA-256 checksums as a job output for publish-pypi.
      - name: Build Patchright-Python Package
        id: build
        run: |
          cd playwright-python
          uv pip install -e .
          for wheel in $(uv run setup.py --list-wheels); do
            PLAYWRIGHT_TARGET_WHEEL=$wheel uv build --wheel
          done
          manifest=$(sha256sum dist/*)
          echo "$manifest"
          {
            echo "sha256<<SHA256_EOF"
            echo "$manifest"
            echo "SHA256_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Patchright-Python Package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: patchright-python-dist
          path: playwright-python/dist/
          if-no-files-found: error
          retention-days: 7 # only needed until publish-pypi has run

  publish-pypi:
    name: "Patchright-Python Workflow: Publish Patchright Python Package"
    needs: [patchright-release-workflow]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/patchright
    # The only job that can get a publish token. It checks out no code and builds nothing:
    # it only verifies and publishes the wheels.
    permissions:
      id-token: write # For trusted Publishing
    steps:
      - name: Download Patchright-Python Package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: patchright-python-dist
          path: dist/

      # Publish exactly what the build job built: no changed, missing or extra files.
      - name: Verify Package Checksums
        env:
          SHA256_MANIFEST: ${{ needs.patchright-release-workflow.outputs.sha256 }}
        run: |
          printf '%s\n' "$SHA256_MANIFEST" | sha256sum --check --strict
          # Refuse to publish files that were not in the build job's manifest.
          test "$(find dist -type f | wc -l)" -eq "$(printf '%s\n' "$SHA256_MANIFEST" | wc -l)"

      - name: Publish Patchright-Python Package
        # PyPA recommends `@release/v1`; this is pinned to the commit of the latest release tag instead,
        # and Dependabot (.github/dependabot.yml) keeps it up to date.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          verbose: true
